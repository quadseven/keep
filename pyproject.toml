[project]
name = "keep"
version = "0.1.0"
description = "Self-hosted single pane of glass for home tech"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
dev = ["pytest>=8", "trustme>=1.2", "httpx>=0.27", "ruff>=0.15"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"src/keep/page.py" = ["E501"]
